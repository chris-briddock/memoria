name: memoria

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: memoria_dev_password
      POSTGRES_DB: memoria
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for photo originals and thumbnails.
  # Console: http://localhost:9001  API: http://localhost:9000
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: memoria
      RUSTFS_SECRET_KEY: memoria_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # Named volume so the container's rustfs user (uid 10001) owns the path.
      - rustfs-data:/data

volumes:
  postgres-data:
  rustfs-data:
