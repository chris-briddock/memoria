name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway credentials that only ever exist inside the CI runner. They match
  # the values the test harnesses hardcode (test/setup.integration.ts,
  # e2e/global-setup.ts, e2e/.env.e2e).
  PGUSER: memoria
  PGPASSWORD: memoria_dev_password

jobs:
  quality:
    name: Lint, typecheck & unit/integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memoria

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: memoria
          POSTGRES_PASSWORD: memoria_dev_password
          POSTGRES_DB: memoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoria -d memoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: memoria/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Create memoria_test via the pg driver (already a dependency) rather than
      # relying on the psql CLI being on the runner image.
      - name: Create the integration test database
        run: |
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client('postgresql://memoria:memoria_dev_password@localhost:5432/postgres');await c.connect();await c.query('CREATE DATABASE memoria_test').catch(e=>{if(e.code!=='42P04')throw e;});await c.end();})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Push the Drizzle schema to the test database
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://memoria:memoria_dev_password@localhost:5432/memoria_test

      - name: Run unit & integration tests with coverage
        run: npm run coverage

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memoria

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: memoria
          POSTGRES_PASSWORD: memoria_dev_password
          POSTGRES_DB: memoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoria -d memoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # S3-compatible object storage; e2e uploads real photos through it.
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
          RUSTFS_CONSOLE_ENABLE: "true"
          RUSTFS_ACCESS_KEY: memoria
          RUSTFS_SECRET_KEY: memoria_dev_secret
        ports:
          - 9000:9000
          - 9001:9001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: memoria/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Create memoria_e2e via the pg driver (already a dependency) rather than
      # relying on the psql CLI being on the runner image.
      - name: Create the e2e test database
        run: |
          node -e "const pg=require('pg');(async()=>{const c=new pg.Client('postgresql://memoria:memoria_dev_password@localhost:5432/postgres');await c.connect();await c.query('CREATE DATABASE memoria_e2e').catch(e=>{if(e.code!=='42P04')throw e;});await c.end();})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Push the Drizzle schema to the e2e database
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://memoria:memoria_dev_password@localhost:5432/memoria_e2e

      # global-setup.ts ensures the bucket; the webServer block boots
      # `next dev` on :3100 with .env.e2e.
      - name: Run e2e tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: memoria/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: memoria

    # /register prerenders at build time and queries `select count(*) from users`
    # to choose bootstrap-vs-invite mode, so the build needs a live database
    # with the schema applied.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: memoria
          POSTGRES_PASSWORD: memoria_dev_password
          POSTGRES_DB: memoria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoria -d memoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://memoria:memoria_dev_password@localhost:5432/memoria
      AUTH_SECRET: build-placeholder-secret
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: placeholder
      S3_ACCESS_KEY_ID: placeholder
      S3_SECRET_ACCESS_KEY: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: memoria/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Push the Drizzle schema
        run: npx drizzle-kit push --force

      # Catches build-only errors: RSC boundary violations, type errors surfaced
      # at build time, and prerender failures (e.g. /register's user count).
      - name: next build
        run: npm run build
